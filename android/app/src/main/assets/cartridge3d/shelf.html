<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Film shelf</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; background: #141210; }
  canvas { display: block; width: 100%; height: 100%; }
  .ui { position: fixed; color: #ece6da; font-family: sans-serif; pointer-events: none; }
  #title { left: max(70px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); font: italic 21px Georgia, serif; }
  #title small { display: block; margin-top: 4px; font: 11px monospace; letter-spacing: 0.2em; color: rgba(236,230,218,0.55); font-style: normal; }
  /* a fade behind the title, for when the cabinet scrolls under it */
  #fade { position: fixed; left: 0; right: 0; top: 0; height: calc(max(16px, env(safe-area-inset-top)) + 78px); pointer-events: none;
          background: linear-gradient(rgba(20,18,16,0.92) 55%, rgba(20,18,16,0)); }
  #fadeb { position: fixed; left: 0; right: 0; bottom: 0; height: calc(max(14px, env(safe-area-inset-bottom)) + 46px); pointer-events: none;
           background: linear-gradient(rgba(20,18,16,0), rgba(20,18,16,0.85) 60%); transition: opacity 0.8s; }
  #hint { left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px;
          letter-spacing: 0.08em; color: rgba(236,230,218,0.6); transition: opacity 0.8s; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="fadeb"></div>
<div id="title" class="ui">胶卷架<small id="count"></small></div>
<div id="hint" class="ui">上下拖动 · 点一件，细看它</div>
<script src="three.min.js"></script>
<script src="cartmodel.js"></script>
<script src="papermodel.js"></script>
<script src="shelf.js"></script>
</body>
</html>
