<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Camera back</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; background: #0e0d0c; }
  body { background: radial-gradient(110% 100% at 50% 30%, #2c2925 0%, #161412 60%, #0b0a09 100%); }
  canvas { display: block; width: 100%; height: 100%; }
  .ui { position: fixed; color: #ece6da; font-family: sans-serif; }
  #step { left: max(22px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); font: italic 19px Georgia, serif; }
  #step small { display: block; margin-top: 4px; font: 11px monospace; letter-spacing: 0.2em; color: rgba(236,230,218,0.55); font-style: normal; }
  #hint { left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; font-size: 14px;
          letter-spacing: 0.06em; color: rgba(236,230,218,0.78); pointer-events: none; }
  button.ui { border: 1px solid rgba(236,230,218,0.35); background: rgba(16,15,14,0.6); border-radius: 20px;
              padding: 9px 16px; font-size: 14px; letter-spacing: 0.04em; }
  #act { right: max(22px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: none;
         background: #e3b341; color: #141414; border: none; }
  #skip { right: max(22px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); }
  #veil { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
</style>
</head>
<body>
<div id="step" class="ui"></div>
<div id="hint" class="ui"></div>
<button id="act" class="ui"></button>
<button id="skip" class="ui">跳过</button>
<div id="veil"></div>
<script src="three.min.js"></script>
<script src="cartmodel.js"></script>
<script src="back.js"></script>
</body>
</html>
